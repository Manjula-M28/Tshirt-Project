<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order Placed</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
body {
    background: linear-gradient(135deg, #6a11cb, #2575fc);
    font-family: 'Segoe UI', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 15px;
}

.card-box {
    background: rgba(255, 255, 255, 0.08);
    border-radius: 18px;
    padding: 40px 25px;
    backdrop-filter: blur(12px);
    box-shadow: 0 8px 35px rgba(0,0,0,0.25);
    text-align: center;
    max-width: 460px;
    width: 100%;
    animation: fadeIn 0.8s ease-in-out;
}

@keyframes fadeIn {
    from {opacity: 0; transform: translateY(20px);}
    to {opacity: 1; transform: translateY(0);}
}

.success-icon {
    font-size: 90px;
    color: #00ffb3;
    animation: pop 0.6s ease-in-out;
    text-shadow: 0 0 15px rgba(0,255,179,0.8);
}

@keyframes pop {
    0% { transform: scale(0); opacity: 0; }
    80% { transform: scale(1.1); opacity: 1; }
    100% { transform: scale(1); }
}

h1 {
    margin-top: 20px;
    font-weight: bold;
    color: #fff;
}

p {
    font-size: 1.05rem;
    color: #e0e0e0;
    margin-bottom: 25px;
}

.info-card {
    background: rgba(255, 255, 255, 0.15);
    border-radius: 12px;
    padding: 15px;
    margin-top: 15px;
    color: #fff;
    box-shadow: inset 0 0 12px rgba(255,255,255,0.1);
}

.home-btn {
    display: inline-block;
    margin-top: 20px;
    padding: 12px 25px;
    background: linear-gradient(45deg, #ff416c, #ff4b2b);
    color: #fff;
    border-radius: 8px;
    font-weight: bold;
    transition: 0.3s;
    text-decoration: none;
    box-shadow: 0 5px 15px rgba(255,75,43,0.4);
}

.home-btn:hover {
    transform: scale(1.05);
    box-shadow: 0 8px 20px rgba(255,75,43,0.6);
}

.social-icons a {
    font-size: 22px;
    margin: 10px;
    color: #fff;
    transition: 0.3s;
}

.social-icons a:hover {
    color: #00ffb3;
}
</style>
</head>
<body>

<div class="card-box">
    <i class="fas fa-check-circle success-icon"></i>
    <h1>Order Placed!</h1>
    <p>Your order has been successfully confirmed. We’ll start processing it right away 🚀</p>

    <div class="info-card">
        <h5>📦 Delivery Information</h5>
        <p>Estimated Delivery: <b>3-5 Business Days</b></p>
        <p>Tracking details will be sent to your email soon.</p>
    </div>

    <a href="Textiqueen.html" class="home-btn"><i class="fa fa-shopping-cart" aria-hidden="true"></i> Continue Shopping</a>

    <div class="social-icons mt-3">
        <p style="color: white;">Share your excitement:</p>
        <a href="#"><i class="fab fa-facebook"></i></a>
        <a href="#"><i class="fab fa-twitter"></i></a>
        <a href="#"><i class="fab fa-instagram"></i></a>
    </div>
</div>

</body>
</html>
